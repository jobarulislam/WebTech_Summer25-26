<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/design.css">
    <script type="module" src="../js/validated.js" defer></script>
    
    <title>Student Registration</title>
</head>
<body>
<div class="header">
    <p>this is header</p>
</div>

<div id="container" class="container">
    <form id="regiForm">
        <fieldset id="fieldset">
            <legend id="legend">Student Information</legend>
            <div class="info">
                
                <div class="name">
                    <label for="name">Student Name:</label>
                    <input id="name" type="text" placeholder="Enter student Name">
                    <p id="m1" class="error"></p>
                </div>

                <div class="age">
                    <label for="age">Student Age:</label>
                    <input id="age" type="number" placeholder="Enter Student Age">
                    <p id="m2" class="error"></p>
                </div>

                <div class="email">
                    <label for="email">Student Email:</label>
                    <input id="email" type="email" placeholder="Enter student email">
                    <p id="m3" class="error"></p> <!-- Fixed duplicate m2 -->
                </div>

                <div class="gender">
                    <label>Student Gender:</label>
                    <!-- Linked radios with name="gender" -->
                    <input id="gender_male" type="radio" name="gender" value="male">
                    <label for="gender_male">Male</label>
                    <input id="gender_female" type="radio" name="gender" value="female">
                    <label for="gender_female">Female</label>
                    <p id="m4" class="error"></p> <!-- Renumbered to m4 -->
                </div>

                <div class="student_dob">
                    <label for="student_dob">Student DOB :</label>
                    <input id="student_dob" type="date">
                    <p id="m5" class="error"></p>
                </div>

                <div class="address">
                    <label for="address">Student Address :</label>
                    <input id="address" type="text">
                    <p id="m6" class="error"></p>
                </div>

                <div class="citizenship">
                    <label for="citizenship">Citizenship :</label>
                    <!-- Fixed duplicate ID -->
                    <select name="country" id="citizenship">
                        <option value="default">----Select a country----</option>
                        <option value="bangladesh">Bangladesh</option>
                        <option value="uk">United Kingdom</option>
                    </select>
                    <p id="m7" class="error"></p>
                </div>

                <div class="condition">
                    <input type="checkbox" id="condition">
                    <label for="condition">I agree terms and conditions</label>
                    <p id="m8" class="error"></p>
                </div>

                <div class="button">
                    <button type="submit" class="submit" id="submit">SUBMIT</button>
                    <button type="reset" id="reset">RESET</button>
                </div>

            </div>
        </fieldset>
    </form>
</div>

<div class="footer">
    <p>this is a footer</p>
</div>
</body>
</html>
