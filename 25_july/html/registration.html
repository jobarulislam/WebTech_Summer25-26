<!DOCTYPE HTML>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="">
        <script src="../js/registration.js" defer ></script>
        <title>Student Registration Form</title>
    </head>
    <body>
        <div class="container">
            <h1>Student Registration Form</h1>
        <form id="registrationForm">
            <div class="fullname">
                <label for="fullname">Full Name : </label>
                <input id="fullname" type="text" placeholder="Enter Your Full Name">
            </div>

            <div class="student_id">
                <label for="student_id">Student ID : </label>
                <input type="text" id="student_id">
            </div>

            <div class="email">
                <label for="email">Email : </label>
                <input type="email" id="email">
            </div>

            <div class="password">
                <label for="password">Password : </label>
                <input type="password" id="password">
            </div>

            <div class="c_password">
                <label for="c_password">Confirm Password : </label>
                <input type="password" id="c_password">
            </div>

            <div class="gender">
                <label for="gender">Gender : </label>
                <div class="male">
                    <input type="radio" id="male" name="gender">
                    <label for="male">Male</label>
                </div>

                <div class="female">
                    <input type="radio" id="female" name="gender">
                    <label for="female">Female</label>
                </div>
            </div>

            <div class="department">
                <label for="department">Department : </label>
                <div class="acn">
                    <input type="radio" id="acn" name="department">
                    <label for="acn">ACN</label>
                </div>

                <div class="eee">
                    <input type="radio" id="eee" name="department">
                    <label for="eee">EEE</label>
                </div>

                <div class="cse">
                    <input type="radio" id="cse" name="department">
                    <label for="cse">CSE</label>
                </div>
            </div>

           <input type="checkbox" id="condition">
           <label for="condition">I agrre to the terms</label> 
            
           <div class="button">
            <button id="submit">Submit</button>
           </div>
        </form>
            
        </div>
    </body>

</html>
