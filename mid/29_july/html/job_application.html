<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/job_application.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <form id="applicationForm">
            <div class="name">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="email">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@mail.com" >
            </div>

            <div class="phone">
                <label for="phone">Phone</label>
                <input type="text" id="phone" placeholder="+880 XXXX XXXXXX">
            </div>

            <div class="DOB">
                <label for="DOB">Date of Birth</label>
                <input type="date" id="DOB">
            </div>

            <div class="experience">
                <label for="exp">Experience</label>
                <input type="text" id="exp" placeholder="Add your experiences.....">
            </div>

            <div class="skills">
                <label for="skills">skills</label>
                <input type="text" id="skills" placeholder="Add your skills...">
            </div>

            <div class="upload">
                <label for="upload">Resume Upload</label>
                <input type="file" id="upload" placeholder="Upload your resume">
            </div>

            <div class="upload">
                <label for="letter">Cover Letter</label>
                <input type="file" id="letter" placeholder="Upload your cover letter.">
            </div>

            <button id="submit">Submit</button>
        </form>

        <div id="message"></div>
        <div id="message1"></div>
    </div>
</body>
</html>
