
<html>
    <head>
        <title>JavaScript Practice</title>
        <script>
            const numberOfButtons = document.getElementById("buttons").value;
            function showMessage() {
                alert("Hello, welcome to JavaScript practice!");
            }
            var var1 = 10;
            var name = "test";

            // alert("Variable var1: " + var1 + "\nVariable name: " + name + "\nVariable isActive: " + isActive + "\nConstant pi: " + pi + "\nVariable dept: " + dept);
            function updateHeading() {
                var heading = document.getElementById("practice");
                heading.innerHTML = "JavaScript is fun!";

            console.log("JavaScript code loaded successfully.");


            function add(a, b) {
                return a + b;
            }
            function multiply(a, b) {

            function divide(a, b) {

                    return a / b;
                } else {
                    return "Error: Division by zero";

            }
            function subtract(a, b) {
                return a - b;

            function submitName() {
                //add validation for name field
                var nameInput = document.getElementById("name").value;
                var displayPara = document.getElementById("displayName");
                if (nameInput.trim() === "") {
                    displayPara.innerHTML = "Please enter a valid name.";
                    return;
                }
                
                displayPara.innerHTML = "Your given name is: " + nameInput;
            }
            let totalButtons = 0;
            function createNewButton() {
            // Create a new button element
            var newButton = document.createElement("button");
            
            // Set button text and class
            newButton.innerHTML = "New Button " + (++totalButtons);
            // newButton.className = "new-button";
            
            // // Add click event to the new button
            // newButton.onclick = function() {
            //     alert("You clicked: " + this.innerHTML);
            // };

            if(totalButtons % 2 === 0){
                newButton.style.backgroundColor = "lightblue";
            } else {

                newButton.style.borderRadius = "8px";
            }
            // Append the new button to the container
            document.getElementById("dynamicButtons").appendChild(newButton);
        }
        function createTable(){
            const table = document.createElement('table');
            const tableHeader = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const headers = ['Name', 'Age', 'City'];
            headers.forEach(item=>{
                const th = document.createElement('th');
                th.textContent = item;
                headerRow.appendChild(th);
            })
            tableHeader.appendChild(headerRow);
            table.appendChild(tableHeader);

            const tableBody = document.createElement('tbody');
            const data = [
                {name: 'Alice', age: 30, city: 'New York'},
                {name: 'Bob', age: 25, city: 'Los Angeles'},
                {name: 'Charlie', age: 35, city: 'Chicago'}
            ];
            data.forEach(r=>{
                const row = document.createElement('tr');
                const nameCell = document.createElement('td');
                nameCell.textContent = r.name;
                const ageCell = document.createElement('td');
                ageCell.textContent = r.age;
                const cityCell = document.createElement('td');
                cityCell.textContent = r.city;
                row.appendChild(nameCell);
                row.appendChild(ageCell);
                row.appendChild(cityCell);
                tableBody.appendChild(row);
            })
            table.appendChild(tableBody);
            document.getElementById("dynamicButtons").appendChild(table);
        }
        function createButtons(){
            const n = document.getElementById("buttons").value;
            const numberOfButtons = parseInt(n);
            for(let i =0; i<numberOfButtons; i++){
                const newButton = document.createElement("button");
                newButton.innerHTML = "Button " + (i+1);
                document.getElementById("dynamicButtons").appendChild(newButton);
            }
        }

        </script>
    </head>
    <body>
        <input type="text" id="name" placeholder="Enter your name">

        <p id="displayName">Your given name will be replaced here</p>

            <div id="dynamicButtons" class="dynamic-buttons-container">
                <!-- New buttons will appear here -->
            </div>
        </div>
        <div>
            <button onclick="createTable()">Create Table</button>
        </div>
        <div>
            <input type="text" id="buttons" placeholder="Number of Buttons" >
            <button onclick="createButtons()" >Create N Buttons </button>
        </div>
    </body>
</html>
